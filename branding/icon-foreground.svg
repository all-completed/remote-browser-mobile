<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Adaptive-icon foreground: the emblem from icon.svg, transparent background,
       scaled into the safe zone. The 1024px canvas maps to the 108dp adaptive canvas,
       so the guaranteed-visible 66dp circle is 626px across: the emblem is 476×395,
       centred, bounding circle 618px — inside the safe zone under every mask shape.
       Flat: solid colours, no gradient, no shadow. -->
  <g transform="translate(512,512) scale(0.887) translate(-512,-512)">
    <!-- browser window (white outline) -->
    <g fill="none" stroke="#F4F7FF" stroke-width="17" stroke-linejoin="round">
      <rect x="252" y="298" width="520" height="428" rx="34"/>
      <line x1="252" y1="368" x2="772" y2="368"/>
    </g>
    <g fill="#F4F7FF">
      <circle cx="298" cy="333" r="9.5"/>
      <circle cx="335" cy="333" r="9.5"/>
      <circle cx="372" cy="333" r="9.5"/>
    </g>

    <!-- shield (gold outline) -->
    <path d="M392 430
             C392 414 404 406 418 406
             L606 406
             C620 406 632 414 632 430
             L632 560
             C632 644 578 682 512 706
             C446 682 392 644 392 560 Z"
          fill="none" stroke="#F4C656" stroke-width="24" stroke-linejoin="round"/>

    <!-- key (gold) -->
    <g fill="#F4C656">
      <path d="M499 540 h26 v86 h-26 z"/>
      <rect x="525" y="588" width="22" height="15"/>
      <rect x="525" y="611" width="15" height="13"/>
    </g>
    <circle cx="512" cy="503" r="31.5" fill="none" stroke="#F4C656" stroke-width="27"/>
  </g>
</svg>
